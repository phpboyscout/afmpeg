[project]
site_name = "afmpeg"
site_description = "Pure-Go FFmpeg on a virtual filesystem — no CGO, no host FFmpeg, no temp files."
site_author = "Matt Cockayne"
site_url = "https://afmpeg.phpboyscout.uk"
repo_url = "https://gitlab.com/phpboyscout/afmpeg"
repo_name = "afmpeg"
copyright = "Copyright &copy; 2026 Matt Cockayne"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/nav-specs.js"]

[project.theme]
logo = "images/branding/logo_transparent.svg"
language = "en"
features = [
    "content.action.edit",
    "content.code.annotate",
    "content.code.copy",
    "content.tabs.link",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Status chips for spec frontmatter (mirrors the spec lifecycle).
[project.extra.status]
draft = "Draft"
DRAFT = "Draft"
approved = "Approved"
APPROVED = "Approved"
in-progress = "In Progress"
IN-PROGRESS = "In Progress"
implemented = "Implemented"
IMPLEMENTED = "Implemented"
superseded = "Superseded"
SUPERSEDED = "Superseded"
rejected = "Rejected"
REJECTED = "Rejected"

[[project.extra.social]]
icon = "fontawesome/brands/gitlab"
link = "https://gitlab.com/phpboyscout/afmpeg"

[[project.extra.social]]
icon = "fontawesome/solid/globe"
link = "https://phpboyscout.uk"
