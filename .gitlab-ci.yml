# .gitlab-ci.yml — pipeline assembled from phpboyscout/cicd components.
#
#   merge_request_event → lint, test, security        (the merge gate)
#   default branch      → colophon, zensical-pages deploy
#   schedule            → renovate
#
# Quality gates live exclusively at the MR level — pushing to main runs
# nothing except colophon (which itself opens an MR that gets the
# full gate) and the docs deploy, so by the time anything lands on main it
# has already been vetted.
#
# The zensical-pages deploy fires from **main**, not from a release tag: the
# component's `pages` job is gated on `$CI_COMMIT_BRANCH == "main"` and its
# `zensical-build` explicitly declines to run when `$CI_COMMIT_TAG` is set.
# So the docs site tracks main, and a docs-only change is live as soon as it
# merges — no release needed. Both jobs also carry a `changes` filter
# (docs/**/*, zensical.toml, .gitlab-ci.yml by default), so a code-only
# change does not rebuild the site.
#
# Note the consequence: docs on the site can be ahead of the newest tag,
# while pkg.go.dev renders doc.go from the tag and so lags until the next
# release. That is the intended trade — a docs fix should not need a release.
#
# NOTE: afmpeg is library-first (spec 0001 / 0004). There is no goreleaser
# job yet — it ships no binary. When `cmd/afmpeg` lands (spec 0006 / 2D),
# add the `goreleaser` component here. The GPL `ffmpeg.wasm` (spec 0002) is
# published as a SEPARATE artifact, never built into a release binary (D-C).
#
# Project setting prerequisites:
#   • Pipelines must succeed (so MR gates actually block merge)
#   • Merge method: fast-forward (so the tested commit is what lands on main)
#
# Components pinned to phpboyscout/cicd v0.18.1; Renovate (also via this
# pipeline) keeps the pins current via the cicd preset extended in
# renovate.json.

include:
  # Quality gates — MR-only by default. Toolchain + tools come from the
  # cicd dev-tools image baked into the components (Go 1.26.x, govulncheck,
  # golangci-lint).
  - component: gitlab.com/phpboyscout/cicd/go-lint@v0.39.4
  - component: gitlab.com/phpboyscout/cicd/go-test@v0.39.4
  - component: gitlab.com/phpboyscout/cicd/go-security@v0.39.4

  # Docs — main-branch zensical-pages deploy.
  - component: gitlab.com/phpboyscout/cicd/zensical-pages@v0.39.4

  # Release MR machinery — our wrapper over apricote/releaser-pleaser
  # (carries the schedule-never guard, so it does not fire on the Renovate
  # schedule).
  - component: gitlab.com/phpboyscout/cicd/colophon@v0.42.0
    inputs:
      branch: main
      stage: release

  # Scheduled Renovate run — wires its own schedule gate; the cicd preset
  # (extended in renovate.json) carries the custom manager that auto-bumps
  # the component pins above.

  # Announce releases to the Discord announcements channel. Minor and
  # major cuts only by default; the webhook comes from the
  # DISCORD_RELEASE_WEBHOOK group variable, which is protected and so
  # reaches this job because `v*` is a protected tag here.
  - component: gitlab.com/phpboyscout/cicd/discord-release@v0.39.4
    inputs:
      # Headline project: patch releases are news here too.
      announce_patches: true

stages:
  - lint
  - test
  - security
  - release
  - notify
  - pages
  - renovate

# Pipeline-source gating: MR pipelines are primary; main pipelines exist
# only so colophon can maintain its MR. The `never` rule suppresses
# duplicate branch pipelines when a feature branch already has an open MR.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

variables:
  # colophon walks the full commit history.
  GIT_DEPTH: "0"

# ----------------------------------------------------------------------
# Public-API diff — ADVISORY (non-blocking) while pre-1.0.
#
# afmpeg is v0.x; breaking changes are permitted and ship as a MINOR bump
# until v1.0, so a hard gate would reject legitimate breaks. This job
# exists for VISIBILITY: it prints the public-API delta between the latest
# release tag and the MR tree so a reviewer can confirm any change is
# intentional. scripts/apidiff.sh always exits 0; allow_failure is a
# belt-and-braces guard. AT v1.0 THIS BECOMES A BLOCKING GATE.
apidiff:
  stage: test
  image: registry.gitlab.com/phpboyscout/images/go-tools:v0.2.0
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - ./scripts/apidiff.sh

# coverage-policy — advisory per-package ≥90% coverage check.
#
# Flags any countable package below the threshold in .coverage-policy.yaml
# that is not on the exclusion list. allow_failure: true keeps it advisory —
# a violation is a non-blocking warning, never gating a merge. To clear a
# flag: add tests, or add the package to .coverage-policy.yaml `excluded:`
# with a rationale.
coverage-policy:
  stage: test
  image: registry.gitlab.com/phpboyscout/images/go-tools:v0.2.0
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - ./scripts/coverage-policy.sh
