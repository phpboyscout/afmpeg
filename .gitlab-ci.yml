# .gitlab-ci.yml — pipeline assembled from phpboyscout/cicd components.
#
#   merge_request_event → lint, test, security        (the merge gate)
#   default branch      → releaser-pleaser, zensical-pages deploy
#   schedule            → renovate
#
# Quality gates live exclusively at the MR level — pushing to main runs
# nothing except releaser-pleaser (which itself opens an MR that gets the
# full gate), so by the time anything lands on main it has already been
# vetted. The zensical-pages deploy fires from the tag releaser-pleaser
# cuts when its Release MR merges, so the docs site always corresponds to
# a real tagged release.
#
# NOTE: afmpeg is library-first (spec 0001 / 0004). There is no goreleaser
# job yet — it ships no binary. When `cmd/afmpeg` lands (spec 0006 / 2D),
# add the `goreleaser` component here. The GPL `ffmpeg.wasm` (spec 0002) is
# published as a SEPARATE artifact, never built into a release binary (D-C).
#
# Project setting prerequisites:
#   • Pipelines must succeed (so MR gates actually block merge)
#   • Merge method: fast-forward (so the tested commit is what lands on main)
#
# Components pinned to phpboyscout/cicd v0.18.1; Renovate (also via this
# pipeline) keeps the pins current via the cicd preset extended in
# renovate.json.

include:
  # Quality gates — MR-only by default. Toolchain + tools come from the
  # cicd dev-tools image baked into the components (Go 1.26.x, govulncheck,
  # golangci-lint).
  - component: gitlab.com/phpboyscout/cicd/go-lint@v0.18.1
  - component: gitlab.com/phpboyscout/cicd/go-test@v0.18.1
  - component: gitlab.com/phpboyscout/cicd/go-security@v0.18.1
    inputs:
      # Bump osv-scanner off the component default (v2.3.8) to v2.4.0 — a routine
      # currency bump; paired with the osv-scanner `script` override below.
      osv_scanner_image: "ghcr.io/google/osv-scanner:v2.4.0"

  # Docs — main-branch zensical-pages deploy.
  - component: gitlab.com/phpboyscout/cicd/zensical-pages@v0.18.1

  # Release MR machinery — our wrapper over apricote/releaser-pleaser
  # (carries the schedule-never guard, so it does not fire on the Renovate
  # schedule).
  - component: gitlab.com/phpboyscout/cicd/releaser-pleaser@v0.18.1
    inputs:
      token: $RELEASER_PLEASER_TOKEN
      branch: main
      stage: release

  # Scheduled Renovate run — wires its own schedule gate; the cicd preset
  # (extended in renovate.json) carries the custom manager that auto-bumps
  # the component pins above.
  - component: gitlab.com/phpboyscout/cicd/renovate-self@v0.18.1
    inputs:
      repositories: '["phpboyscout/afmpeg"]'

stages:
  - lint
  - test
  - security
  - release
  - pages
  - renovate

# Pipeline-source gating: MR pipelines are primary; main pipelines exist
# only so releaser-pleaser can maintain its MR. The `never` rule suppresses
# duplicate branch pipelines when a feature branch already has an open MR.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

variables:
  # releaser-pleaser walks the full commit history.
  GIT_DEPTH: "0"

default:
  tags: [saas-linux-medium-amd64]

# ----------------------------------------------------------------------
# Public-API diff — ADVISORY (non-blocking) while pre-1.0.
#
# afmpeg is v0.x; breaking changes are permitted and ship as a MINOR bump
# until v1.0, so a hard gate would reject legitimate breaks. This job
# exists for VISIBILITY: it prints the public-API delta between the latest
# release tag and the MR tree so a reviewer can confirm any change is
# intentional. scripts/apidiff.sh always exits 0; allow_failure is a
# belt-and-braces guard. AT v1.0 THIS BECOMES A BLOCKING GATE.
apidiff:
  stage: test
  image: golang:1.26-bookworm
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - ./scripts/apidiff.sh

# coverage-policy — advisory per-package ≥90% coverage check.
#
# Flags any countable package below the threshold in .coverage-policy.yaml
# that is not on the exclusion list. allow_failure: true keeps it advisory —
# a violation is a non-blocking warning, never gating a merge. To clear a
# flag: add tests, or add the package to .coverage-policy.yaml `excluded:`
# with a rationale.
coverage-policy:
  stage: test
  image: golang:1.26-bookworm
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - ./scripts/coverage-policy.sh

# ----------------------------------------------------------------------
# osv-scanner override — apply our ignore list and skip call-analysis.
#
# The go-security component runs `/osv-scanner -L go.mod`, which needs two
# adjustments for afmpeg:
#
#   1. --config .osv-scanner.toml — the component passes no --config and the
#      scanner does not auto-discover the repo config for a lockfile scan, so
#      our ignore of GO-2026-5932 (golang.org/x/crypto — an advisory with NO
#      upstream fix that govulncheck confirms afmpeg does not call) never
#      applied. Pass it explicitly.
#   2. --no-call-analysis=all — osv-scanner runs an internal govulncheck to
#      prune unreachable findings, which BUILDS the module with the Go bundled
#      in the scanner image (GOTOOLCHAIN=local). Since go.mod now requires
#      1.26.5 and the image bundles older Go, that build fails and osv-scanner
#      exits 127 once the ignore empties the result set. Reachability is
#      already covered by the dedicated (build-aware) govulncheck job, so
#      disabling osv-scanner's own call-analysis loses no coverage and removes
#      the fragile toolchain coupling.
#
# We keep osv-scanner running (not disabled). Only `script` is overridden;
# stage/image/rules are inherited from the component. Remove once x/crypto
# ships a fix (Renovate bumps it) or the component handles both natively.
osv-scanner:
  script:
    - echo "go-security (afmpeg override) — osv-scanner -L go.mod --config .osv-scanner.toml --no-call-analysis=all"
    - /osv-scanner -L go.mod --config .osv-scanner.toml --no-call-analysis=all
