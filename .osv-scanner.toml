# osv-scanner ignore list.
#
# Each entry suppresses ONE advisory that osv-scanner flags at the dependency
# level but which does not represent an actionable, reachable risk for afmpeg.
# Keep this list short and dated: every entry carries a reason and an
# `ignoreUntil` review date so it cannot silently outlive its justification.

[[IgnoredVulns]]
id = "GO-2026-5932"
ignoreUntil = 2026-09-11
# golang.org/x/crypto @ v0.53.0 — NO fixed version is available upstream yet, so
# there is nothing to bump to. govulncheck (call-graph aware) does not report
# this as reachable from afmpeg's code, i.e. we do not call the affected symbol.
# osv-scanner flags it at the module level regardless of reachability. Revisit at
# ignoreUntil: drop this entry once x/crypto ships a fix and Renovate bumps it.
reason = "x/crypto v0.53.0: no upstream fix yet; not reachable per govulncheck. Remove when fixed."
